project: rock

backends:
  craft:
    type: craft
    systems:
      - ubuntu-24.04:
      #- ubuntu-22.04:

suites:
  spread/general/:
    summary: General integration tests
    environment:
      # Goss environment
      GOSS_OPTS: "--retry-timeout=60s"
      GOSS_FILES_STRATEGY: cp
      DGOSS_TEMP_DIR: "$HOME"

    prepare: |
      # Install dependencies
      sudo snap install docker

      # FIXME: https://github.com/canonical/opentelemetry-collector-rock/issues/233
      GOSS_VERSION="${GOSS_VERSION:-v0.4.9}"
      curl -fsSL "https://github.com/goss-org/goss/releases/download/${GOSS_VERSION}/goss-linux-amd64" -o /usr/local/bin/goss
      chmod +rx /usr/local/bin/goss
      curl -fsSL "https://raw.githubusercontent.com/goss-org/goss/master/extras/dgoss/dgoss" -o /usr/local/bin/dgoss
      chmod +rx /usr/local/bin/dgoss

      # For 'rockcraft.skopeo'
      sudo snap install --classic rockcraft

      # Wait for docker daemon to come online
      for i in $(seq 1 10); do docker info >/dev/null 2>&1 && break || sleep 2; done

      # Load the rock into docker
      sudo rockcraft.skopeo --insecure-policy copy "oci-archive:$CRAFT_ARTIFACT" docker-daemon:rockcraft-test:latest
      
    restore: |
      docker image rm --force rockcraft-test:latest

exclude:
  - .git

kill-timeout: 1h
